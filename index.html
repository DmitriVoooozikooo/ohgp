const DEFAULT_ICON = "🎮";

// PAGINATION SETTINGS - Change this number to show more/fewer games per load
const GAMES_PER_PAGE = 48;
let currentDisplayCount = GAMES_PER_PAGE;
let shuffledGames = [];
let allGames = [];

// Shuffle function
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Load recent games from localStorage
function loadRecentGames() {
  const stored = localStorage.getItem("arcade_fun_recent_games");
  if (!stored) return [];
  try {
    const parsed = JSON.parse(stored);
    if (Array.isArray(parsed)) return parsed.slice(0, 12);
  } catch (e) {
    console.warn(e);
  }
  return [];
}

// Save recent games to localStorage
function saveRecentGames(recentArray) {
  localStorage.setItem("arcade_fun_recent_games", JSON.stringify(recentArray.slice(0, 12)));
}

// Add game to recent list
function addGameToRecent(game) {
  let recent = loadRecentGames();
  recent = recent.filter(g => g.name !== game.name);
  recent.unshift({ name: game.name, icon: game.icon || DEFAULT_ICON, url: game.url });
  if (recent.length > 10) recent.pop();
  saveRecentGames(recent);
  renderRecentList();
}

// Clear recent history
function clearRecentHistory() {
  saveRecentGames([]);
  renderRecentList();
}

// Render recent games list
function renderRecentList() {
  const recentContainer = document.getElementById("recentListContainer");
  if (!recentContainer) return;
  const recentGames = loadRecentGames();
  if (recentGames.length === 0) {
    recentContainer.innerHTML = '<div class="empty-recent">🎈 no recent games! click some tiles! 🎈</div>';
    return;
  }
  recentContainer.innerHTML = recentGames.map(game => `
    <a href="#" class="recent-tile" data-game-name="${escapeHtml(game.name)}" data-game-icon="${escapeHtml(game.icon)}" data-game-url="${escapeHtml(game.url)}">
      <span>${game.icon || DEFAULT_ICON}</span>
      <span>${escapeHtml(game.name)}</span>
    </a>
  `).join("");

  document.querySelectorAll(".recent-tile").forEach(tile => {
    tile.addEventListener("click", e => {
      e.preventDefault();
      const name = tile.getAttribute("data-game-name");
      const icon = tile.getAttribute("data-game-icon");
      const url = tile.getAttribute("data-game-url");
      if (name) handleGameClick({ name: name, icon: icon, url: url });
    });
  });
}

// Escape HTML to prevent injection
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// Handle game click - opens in new tab and saves to recent
function handleGameClick(game) {
  addGameToRecent(game);
  if (game.url && game.url !== '#') {
    window.open(game.url, "_blank");
    showArcadeToast(`🎮 LAUNCHING: ${game.name} in new tab! 🎮`);
  } else {
    const fallbackUrl = `https://example.com/game/${game.name.toLowerCase().replace(/\s+/g, "-")}`;
    window.open(fallbackUrl, "_blank");
    showArcadeToast(`🎮 LAUNCHING: ${game.name} in new tab! 🎮`);
  }
  renderRecentList();
}

// Toast notification
let toastTimeout;
function showArcadeToast(msg) {
  let existingToast = document.getElementById("arcade-toast");
  if (existingToast) existingToast.remove();
  const toast = document.createElement("div");
  toast.id = "arcade-toast";
  toast.innerText = msg;
  toast.style.position = "fixed";
  toast.style.bottom = "30px";
  toast.style.left = "50%";
  toast.style.transform = "translateX(-50%)";
  toast.style.backgroundColor = "#f3c26b";
  toast.style.color = "#2b1635";
  toast.style.fontWeight = "bold";
  toast.style.padding = "12px 28px";
  toast.style.borderRadius = "60px";
  toast.style.fontFamily = "monospace";
  toast.style.fontSize = "1.3rem";
  toast.style.zIndex = "9999";
  toast.style.border = "3px solid #ff8c42";
  toast.style.boxShadow = "0 8px 0 #aa6f2c";
  toast.style.backdropFilter = "blur(6px)";
  document.body.appendChild(toast);
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    if (toast) toast.remove();
  }, 1800);
}

// Main render function for game grid
function renderGameGrid(filterText = "") {
  const container = document.getElementById("gamesContainer");
  if (!container) return;

  const lowerFilter = filterText.toLowerCase().trim();
  
  // Determine which games to show based on search
  let filteredGames;
  if (lowerFilter === "") {
    filteredGames = shuffledGames;
  } else {
    filteredGames = allGames.filter(game => game.name.toLowerCase().includes(lowerFilter));
  }

  if (filteredGames.length === 0) {
    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; background:#472e5e; padding:2rem; border-radius:60px; color:#ffdd99;">😭 NO GAMES FOUND — try something else 😭</div>`;
    return;
  }

  // If searching, show ALL results (no pagination)
  if (lowerFilter !== "") {
    container.innerHTML = filteredGames.map(game => `
      <a href="#" class="game-tile" data-game='${JSON.stringify(game)}'>
        <div class="game-icon">${game.icon || DEFAULT_ICON}</div>
        <div class="game-name">${escapeHtml(game.name)}</div>
      </a>
    `).join("");
    
    attachGameTileEvents();
    return;
  }

  // Normal view with pagination (shuffled)
  const gamesToShow = filteredGames.slice(0, currentDisplayCount);
  const hasMore = currentDisplayCount < filteredGames.length;

  let gamesHtml = gamesToShow.map(game => `
    <a href="#" class="game-tile" data-game='${JSON.stringify(game)}'>
      <div class="game-icon">${game.icon || DEFAULT_ICON}</div>
      <div class="game-name">${escapeHtml(game.name)}</div>
    </a>
  `).join("");

  if (hasMore) {
    gamesHtml += `<div class="see-more-container" style="grid-column:1/-1; display:flex; justify-content:center; margin-top:1.5rem;">
      <button id="seeMoreBtn" class="random-btn" style="background:#6c3c9e; font-size:1.2rem; padding:0.8rem 2rem; cursor:pointer;">👇 SEE MORE (${currentDisplayCount}/${filteredGames.length}) 👇</button>
    </div>`;
  }

  container.innerHTML = gamesHtml;
  attachGameTileEvents();

  // Attach see more button event
  if (hasMore) {
    const seeMoreBtn = document.getElementById("seeMoreBtn");
    if (seeMoreBtn) {
      seeMoreBtn.addEventListener("click", (e) => {
        e.preventDefault();
        currentDisplayCount += GAMES_PER_PAGE;
        renderGameGrid("");
      });
    }
  }
}

// Attach click events to game tiles
function attachGameTileEvents() {
  document.querySelectorAll('.game-tile').forEach(tile => {
    tile.addEventListener('click', (e) => {
      e.preventDefault();
      const rawData = tile.getAttribute('data-game');
      if (rawData) {
        try {
          handleGameClick(JSON.parse(rawData));
        } catch (err) {
          console.warn(err);
        }
      }
    });
  });
}

// Pick and open a random game
function pickRandomGame() {
  if (allGames.length === 0) return;
  const randomIndex = Math.floor(Math.random() * allGames.length);
  const randomGame = allGames[randomIndex];
  handleGameClick(randomGame);
  showArcadeToast(`🎲 RANDOM: ${randomGame.name} opening in new tab! 🎲`);
}

// Initialize search input
function initSearch() {
  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    searchInput.addEventListener("input", e => {
      renderGameGrid(e.target.value);
    });
  }
}

// Initialize clear recent button
function initClearRecent() {
  const clearBtn = document.getElementById("clearRecentBtn");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      clearRecentHistory();
      showArcadeToast("🧹 recent history wiped clean!");
    });
  }
}

// Initialize random button
function initRandomBtn() {
  const randBtn = document.getElementById("randomGameBtn");
  if (randBtn) {
    randBtn.addEventListener("click", () => {
      pickRandomGame();
    });
  }
}

// Initialize everything
function init() {
  // Make a copy of GAMES_CATALOG
  allGames = [...GAMES_CATALOG];
  // Create shuffled version for random display
  shuffledGames = shuffleArray([...GAMES_CATALOG]);
  // Reset pagination counter
  currentDisplayCount = GAMES_PER_PAGE;
  // Render the grid
  renderGameGrid("");
  // Initialize all event listeners
  initSearch();
  initClearRecent();
  initRandomBtn();
  renderRecentList();
}

// Start everything when page loads
document.addEventListener("DOMContentLoaded", init);
</script>
