<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>🎮 ARCADE 🕹️</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;user-select:none}body{background:repeating-linear-gradient(45deg,#1a0b2e 0,#1a0b2e 40px,#2a1545 40px,#2a1545 80px);font-family:'Courier New','Press Start 2P','Comic Neue','Chalkboard SE','Comic Sans MS',cursive,monospace;min-height:100vh;padding:2rem 1.5rem}.cabinet{max-width:1400px;margin:0 auto;background:rgba(0,0,0,.65);border-radius:72px 72px 48px 48px;padding:2rem 2rem 2.5rem;backdrop-filter:blur(3px);box-shadow:0 20px 35px rgba(0,0,0,.5),inset 0 1px 4px rgba(255,255,200,.2);border:3px solid #fd9;border-top-color:#ffe6b3;transition:all .2s}h1{text-align:center;font-size:3rem;letter-spacing:5px;background:linear-gradient(135deg,#f9f047,#ffb347,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:4px 4px 0 #3a1f5e;margin-bottom:.5rem;word-break:keep-all;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}h1 span{font-size:3rem;filter:drop-shadow(2px 2px 0 #000)}.sub{text-align:center;color:#ffd966;background:#2b0f3ecc;display:inline-block;width:auto;margin:0 auto 1.8rem;padding:.5rem 1.5rem;border-radius:60px;backdrop-filter:blur(4px);font-weight:700;font-size:1.2rem;border:1px solid #ffb347}.search-panel{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-bottom:2.5rem;align-items:stretch}.search-box{flex:3;min-width:200px;background:#fef1cf;border-radius:100px;display:flex;align-items:center;padding:0 1.2rem;border:3px solid #fa4;box-shadow:inset 0 1px 5px rgba(0,0,0,.2),0 5px 0 #862}.search-box label{font-size:1.7rem;margin-right:.6rem}#searchInput{background:0 0;border:none;padding:.9rem .5rem;font-size:1.2rem;font-family:'Courier New',monospace;font-weight:700;width:100%;outline:0;color:#2c1a3a}#searchInput::placeholder{color:#b38f6f;font-style:italic}.random-btn{background:#ffa62e;border:none;font-family:inherit;font-weight:700;font-size:1.3rem;padding:0 1.6rem;border-radius:3rem;display:flex;align-items:center;gap:12px;cursor:pointer;transition:70ms linear;box-shadow:0 6px 0 #8b4b1a;color:#2f1a2f}.random-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #8b4b1a}.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,220px));gap:1.8rem;justify-content:center;margin-bottom:3rem;padding:.5rem}.game-tile{display:flex;flex-direction:column;align-items:center;background:linear-gradient(145deg,#ffe5b4,#ffcf8a);padding:1.2rem .5rem 1rem;border-radius:32px;text-decoration:none;color:#2d1b3c;font-weight:700;font-size:1.25rem;transition:all .12s ease;box-shadow:0 12px 0 #a55d2a;border:2px solid #ffefb0;text-align:center;cursor:pointer;transform:scale(1)}.game-tile:hover{transform:translateY(-4px);background:#fff0bc;box-shadow:0 16px 0 #a55d2a}.game-tile:active{transform:translateY(6px);box-shadow:0 6px 0 #a55d2a}.game-icon{font-size:3.4rem;margin-bottom:.6rem;display:block;filter:drop-shadow(2px 2px 0 #9b6a38)}.game-name{background:#391d2e7a;padding:.2rem .6rem;border-radius:50px;font-size:1rem;width:90%;white-space:nowrap;overflow-x:hidden;text-overflow:ellipsis;color:#281a2b;font-weight:700}.recent-section{margin-top:2rem;background:#150e1fcc;border-radius:56px;padding:1.5rem 1.2rem;backdrop-filter:blur(8px);border:2px dashed #ffbc6e}.recent-header{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:space-between;margin-bottom:1.5rem;padding:0 .5rem}.recent-header h2{font-size:1.9rem;background:#ffd58c;display:inline-block;padding:.2rem 1.2rem;border-radius:4rem;letter-spacing:2px;color:#281633;box-shadow:inset -1px -1px 0 #a55317,3px 3px 0 #00000055}.clear-recent{background:#e05a5a;border:none;font-family:monospace;font-weight:700;font-size:1rem;padding:.5rem 1.2rem;border-radius:2rem;cursor:pointer;color:#fff;transition:80ms linear;box-shadow:0 3px 0 #6b2e2e}.clear-recent:active{transform:translateY(2px);box-shadow:0 1px 0 #6b2e2e}.recent-grid{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center;min-height:90px}.recent-tile{background:#fff0c0;border-radius:30px;padding:.5rem 1rem .5rem 1rem;display:inline-flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:700;text-decoration:none;color:#3a2645;transition:70ms linear;border:1px solid gold;box-shadow:0 4px 8px #000}.recent-tile span:first-child{font-size:1.7rem}.empty-recent{color:#ffcf9a;background:#2a1a2e;padding:.8rem 1.5rem;border-radius:60px;font-style:italic}footer{text-align:center;margin-top:2rem;font-size:.7rem;color:#f5bc70}@media (max-width:650px){.cabinet{padding:1.5rem}.game-tile{min-width:150px}.games-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}h1{font-size:2rem}}
  </style>
</head>
<body>
<div class="cabinet">
  <h1>
    <span>🎲</span> OGHP <span>🍕</span>
  </h1>
  <div style="text-align: center;">
    <div class="sub">⚡ hav fun ⚡</div>
  </div>

  <div class="search-panel">
    <div class="search-box">
      <label>🔍</label>
      <input type="text" id="searchInput" placeholder="search mayhem... 1on1, Candy, Boxhead...">
    </div>
    <button class="random-btn" id="randomGameBtn">🎲 RANDOM GAME 🎲</button>
  </div>

  <div id="gamesContainer" class="games-grid"></div>

  <div class="recent-section">
    <div class="recent-header">
      <h2>🕹️ RECENT PLAYS 🕹️</h2>
      <button id="clearRecentBtn" class="clear-recent">🗑️ CLEAR HISTORY</button>
    </div>
    <div id="recentListContainer" class="recent-grid">
      <div class="empty-recent">✨ no games played yet! click any game tile ✨</div>
    </div>
  </div>
  <footer>💾 poo 💥</footer>
</div>

<script>
  
  const GAMES_CATALOG = [
  { name: "1on1", icon: "⚽", url: "https://example.com/game/1on1" },
  { name: "Football", icon: "🏈", url: "https://example.com/game/football" },
  { name: "Basket Bros.", icon: "🏀", url: "https://example.com/game/basket-bros" },
  { name: "Catch the Candy", icon: "🍬", url: "https://example.com/game/catch-the-candy" },
  { name: "Portal Flash", icon: "🌀", url: "https://example.com/game/portal-flash" },
  { name: "Color World", icon: "🎨", url: "https://example.com/game/color-world" },
  { name: "There Is No Game", icon: "❓", url: "https://example.com/game/there-is-no-game" },
  { name: "Boxhead:2play", icon: "🧟", url: "https://example.com/game/boxhead-2play" }
];
  
  const DEFAULT_ICON="🎮";function loadRecentGames(){const e=localStorage.getItem("arcade_fun_recent_games");if(!e)return[];try{const t=JSON.parse(e);if(Array.isArray(t))return t.slice(0,12)}catch(e){console.warn(e)}return[]}function saveRecentGames(e){localStorage.setItem("arcade_fun_recent_games",JSON.stringify(e.slice(0,12)))}function addGameToRecent(e){let t=loadRecentGames();t=t.filter(t=>t.name!==e.name),t.unshift({name:e.name,icon:e.icon||"🎮",url:e.url}),t.length>10&&t.pop(),saveRecentGames(t),renderRecentList()}function clearRecentHistory(){saveRecentGames([]),renderRecentList()}function renderRecentList(){const e=document.getElementById("recentListContainer");if(!e)return;const t=loadRecentGames();0!==t.length?(e.innerHTML=t.map(e=>`\n    <a href="#" class="recent-tile" data-game-name="${escapeHtml(e.name)}" data-game-icon="${escapeHtml(e.icon)}" data-game-url="${escapeHtml(e.url)}">\n      <span>${e.icon||"🎮"}</span>\n      <span>${escapeHtml(e.name)}</span>\n    </a>\n  `).join(""),document.querySelectorAll(".recent-tile").forEach(e=>{e.addEventListener("click",t=>{t.preventDefault();const n=e.getAttribute("data-game-name"),a=e.getAttribute("data-game-icon"),o=e.getAttribute("data-game-url");n&&handleGameClick({name:n,icon:a,url:o})})})):e.innerHTML='<div class="empty-recent">🎈 no recent games! click some tiles! 🎈</div>'}function escapeHtml(e){return e?e.replace(/[&<>]/g,function(e){return"&"===e?"&amp;":"<"===e?"&lt;":">"===e?"&gt;":e}):""}function handleGameClick(e){if(addGameToRecent(e),e.url&&"#"!==e.url)window.open(e.url,"_blank"),showArcadeToast(`🎮 LAUNCHING: ${e.name} in new tab! 🎮`);else{const t=`https://example.com/game/${e.name.toLowerCase().replace(/\s+/g,"-")}`;window.open(t,"_blank"),showArcadeToast(`🎮 LAUNCHING: ${e.name} in new tab! 🎮`)}renderRecentList()}let toastTimeout;function showArcadeToast(e){let t=document.getElementById("arcade-toast");t&&t.remove();const n=document.createElement("div");n.id="arcade-toast",n.innerText=e,n.style.position="fixed",n.style.bottom="30px",n.style.left="50%",n.style.transform="translateX(-50%)",n.style.backgroundColor="#f3c26b",n.style.color="#2b1635",n.style.fontWeight="bold",n.style.padding="12px 28px",n.style.borderRadius="60px",n.style.fontFamily="monospace",n.style.fontSize="1.3rem",n.style.zIndex="9999",n.style.border="3px solid #ff8c42",n.style.boxShadow="0 8px 0 #aa6f2c",n.style.backdropFilter="blur(6px)",document.body.appendChild(n),toastTimeout&&clearTimeout(toastTimeout),toastTimeout=setTimeout(()=>{n&&n.remove()},1800)}function renderGameGrid(e=""){const t=document.getElementById("gamesContainer");if(!t)return;const n=e.toLowerCase().trim();let a=GAMES_CATALOG;""!==n&&(a=GAMES_CATALOG.filter(e=>e.name.toLowerCase().includes(n))),0!==a.length?(t.innerHTML=a.map(e=>`\n    <a href="#" class="game-tile" data-game='${JSON.stringify(e)}'>\n      <div class="game-icon">${e.icon||"🎮"}</div>\n      <div class="game-name">${escapeHtml(e.name)}</div>\n    </a>\n  `).join(""),document.querySelectorAll(".game-tile").forEach(e=>{e.addEventListener("click",t=>{t.preventDefault();const n=e.getAttribute("data-game");if(n)try{handleGameClick(JSON.parse(n))}catch(e){console.warn(e)}})})):t.innerHTML="<div style=\"grid-column:1/-1; text-align:center; background:#472e5e; padding:2rem; border-radius:60px; color:#ffdd99;\">😭 NO GAMES FOUND — try 'football' or 'candy' 😭</div>"}function pickRandomGame(){if(0===GAMES_CATALOG.length)return;const e=Math.floor(Math.random()*GAMES_CATALOG.length),t=GAMES_CATALOG[e];handleGameClick(t),showArcadeToast(`🎲 RANDOM: ${t.name} opening in new tab! 🎲`)}function initSearch(){const e=document.getElementById("searchInput");e&&e.addEventListener("input",e=>{renderGameGrid(e.target.value)})}function initClearRecent(){const e=document.getElementById("clearRecentBtn");e&&e.addEventListener("click",()=>{clearRecentHistory(),showArcadeToast("🧹 recent history wiped clean!")})}function initRandomBtn(){const e=document.getElementById("randomGameBtn");e&&e.addEventListener("click",()=>{pickRandomGame()})}function init(){renderGameGrid(""),initSearch(),initClearRecent(),initRandomBtn(),renderRecentList()}document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
